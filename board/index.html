<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>*{box-sizing:border-box}[hidden]{display:none!important}</style></head><body><title>Ma'Loa Gesamtboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Figtree:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: eine große Leinwand, Bereiche als Rahmen in Reihen, Zoomen und Ziehen wie auf einem Whiteboard */
:root{
  --canvas:#D9E2E2; --frame:#FFFAF2; --ink:#343739; --mute:#5E7473; --line:rgba(0,68,67,.14);
  --red:#004443; --rosa:#86D4C3; --bord:#004443; --bar:rgba(255,250,242,.92);
  --display:'Outfit',system-ui,sans-serif; --sans:'Figtree',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#001F1E;--frame:#002B2A;--ink:#FFFAF2;--mute:#8BAAAA;--line:rgba(255,250,242,.14);--bar:rgba(0,43,42,.92);--red:#86D4C3;color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#001F1E;--frame:#002B2A;--ink:#FFFAF2;--mute:#8BAAAA;--line:rgba(255,250,242,.14);--bar:rgba(0,43,42,.92);--red:#86D4C3;color-scheme:dark}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);overflow:hidden;margin:0}
#bar{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.r1 h1{font-family:var(--display);font-weight:800;font-size:28px;color:var(--red);margin:0;line-height:1}
.r1 .meta{font-family:var(--mono);font-size:12px;color:var(--mute);flex:1;min-width:0}
.btns{display:flex;gap:6px}
button{font:600 13px var(--sans);color:var(--ink);background:var(--frame);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--red)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button.main{background:var(--red);color:#FBF7F0;border-color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;font:600 12px var(--sans);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip:hover{background:var(--rosa);color:#1A1714}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.sec{position:absolute;background:var(--frame);border-radius:40px;box-shadow:0 30px 80px rgba(26,10,10,.10);border:1px solid var(--line)}
.sec h2{position:absolute;left:60px;top:44px;margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.03em;letter-spacing:-.01em;font-size:120px;line-height:1;color:var(--red);text-wrap:balance}
.sec .sub{position:absolute;left:64px;top:170px;font-family:var(--mono);font-size:30px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.it{position:absolute;border-radius:18px;overflow:hidden;background:var(--canvas);cursor:zoom-in;outline:1px solid var(--line)}
.it img,.it video{width:100%;height:100%;object-fit:cover;display:block}
.it.svg{display:grid;place-items:center}
.it.svg img{width:72%;height:72%;object-fit:contain}
.it .vb{position:absolute;right:14px;top:14px;font:700 22px var(--mono);background:#FF7700;color:#fff;border-radius:999px;padding:4px 14px}
.farben{display:grid;grid-template-columns:repeat(7,1fr);height:100%}
.farben div{display:flex;flex-direction:column;justify-content:flex-end;padding:22px;font:700 24px var(--mono);gap:6px}
.farben b{font:800 40px var(--display)}
#hint{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:10;font:12px var(--mono);color:var(--mute);background:var(--bar);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#lb{position:fixed;inset:0;z-index:20;background:rgba(10,5,5,.88);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px calc(env(safe-area-inset-bottom,0px) + 56px)}
#lb img,#lb video{max-width:100%;max-height:100%;border-radius:12px;background:#000}
#lb .cap{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;color:#F3EBDD;font:13px var(--mono)}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;font:700 22px var(--sans);padding:0;display:grid;place-items:center;z-index:2}
#lb #lbp{left:16px;right:auto}#lb #lbn{right:16px}
#lb button{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);background:#F3EADB;color:#1A1714}
@media (prefers-reduced-motion:reduce){#world{transition:none!important}}
</style>

<div id="bar">
  <div class="r1"><h1>Ma'Loa</h1><span class="meta" id="meta"></span>
    <div class="btns"><button id="zo" aria-label="Verkleinern">−</button><button id="zi" aria-label="Vergrößern">+</button><button class="main" id="fit">Alles zeigen</button></div></div>
  <div class="chips" id="chips"></div>
</div>
<div id="stage"><div id="world"></div></div>
<div id="hint">Ziehen zum Bewegen · Mausrad oder zwei Finger zum Zoomen · Klick öffnet groß</div>
<div id="lb" hidden><button id="lbx">Schließen</button><button class="nav" id="lbp" aria-label="Zurück">&#8249;</button><button class="nav" id="lbn" aria-label="Weiter">&#8250;</button><div id="lbin" style="display:contents"></div><div class="cap" id="lbc"></div></div>

<script type="text/plain" id="app">
var DATA = window.__DATA;
var world = document.getElementById("world"), stage = document.getElementById("stage");
var COLW = 560, GAP = 36, PAD = 60, HEAD = 250, ROWMAX = 15500, SGAP = 120;
var secs = [], items = [], vids = [];

/* ---------- Aufbau: Bereiche als Rahmen, darin Spalten (immer in die kürzeste Spalte legen) ---------- */
var x = 0, y = 0, rowH = 0;
DATA.forEach(function(s, si){
  var cols = Math.max(1, Math.min(s.cols, s.items.length)), colw = s.items.some(function(i){return i.t==="farben";}) ? COLW : COLW;
  var heights = new Array(cols).fill(0), placed = [];
  s.items.forEach(function(it){
    var span = it.t === "farben" ? cols : 1, w = span * colw + (span - 1) * GAP, h = Math.round(w * it.h / it.w);
    var c = 0; if (span === 1) { for (var k = 1; k < cols; k++) if (heights[k] < heights[c]) c = k; }
    var top = span === 1 ? heights[c] : Math.max.apply(null, heights);
    placed.push({it: it, x: c * (colw + GAP), y: top, w: w, h: h});
    if (span === 1) heights[c] = top + h + GAP; else heights = heights.map(function(){ return top + h + GAP; });
  });
  var W = cols * colw + (cols - 1) * GAP + 2 * PAD, H = HEAD + Math.max.apply(null, heights) - GAP + PAD;
  if (x > 0 && x + W > ROWMAX) { x = 0; y += rowH + SGAP; rowH = 0; }
  var el = document.createElement("section"); el.className = "sec";
  el.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + W + "px;height:" + H + "px";
  el.innerHTML = '<h2></h2><div class="sub"></div>'; el.querySelector("h2").textContent = s.title; el.querySelector(".sub").textContent = s.sub + " · " + s.items.length;
  placed.forEach(function(p, pi){
    var d = document.createElement("div"); d.className = "it" + (p.it.t === "svg" ? " svg" : ""); d.tabIndex = 0;
    d.style.cssText = "left:" + (PAD + p.x) + "px;top:" + (HEAD + p.y) + "px;width:" + p.w + "px;height:" + p.h + "px" + (p.it.bg ? ";background:" + p.it.bg : "");
    if (p.it.t === "img" || p.it.t === "svg") d.innerHTML = '<img decoding="async" alt="" data-e="' + p.it.src + '"' + (p.it.hi ? ' data-hi="' + p.it.hi + '"' : '') + '>';
    else if (p.it.t === "vid") { d.innerHTML = '<video muted loop playsinline preload="metadata" data-e="' + p.it.src + '"></video><span class="vb">▶ Video</span>'; vids.push(d.querySelector("video")); }
    else if (p.it.t === "farben") { d.style.cursor = "default"; d.innerHTML = '<div class="farben">' + [["Teal","#004443","#FFFFFF"],["Weiß","#FFFFFF","#004443"],["Mist","#D9E2E2","#004443"],["Salbei","#8BAAAA","#002B2A"],["Seafoam","#86D4C3","#002B2A"],["Orange","#FF7700","#FFFFFF"],["Kohle","#343739","#FFFFFF"]].map(function(c){ return '<div style="background:' + c[1] + ';color:' + c[2] + '"><b>' + c[0] + '</b>' + c[1] + '</div>'; }).join("") + '</div>'; }
    if (p.it.t !== "farben") { d.dataset.i = items.length; items.push({it: p.it, title: s.title, n: pi + 1, of: placed.length}); }
    el.appendChild(d);
  });
  world.appendChild(el); secs.push({el: el, x: x, y: y, w: W, h: H, title: s.title});
  x += W + SGAP; rowH = Math.max(rowH, H);
});
var WORLDW = Math.max.apply(null, secs.map(function(s){return s.x + s.w;})), WORLDH = y + rowH;
document.getElementById("meta").textContent = secs.length + " Bereiche · " + items.length + " Elemente";

/* ---------- Zoomen und Ziehen ---------- */
var S = {x: 0, y: 0, k: .05};
function apply(anim){ world.style.transition = anim ? "transform .45s cubic-bezier(.2,.7,.2,1)" : "none"; world.style.transform = "translate(" + S.x + "px," + S.y + "px) scale(" + S.k + ")"; clearTimeout(apply.t); apply.t = setTimeout(function(){ videos(); sharpen(); }, anim ? 480 : 140); }
function topH(){ return document.getElementById("bar").offsetHeight; }
function fitTo(bx, by, bw, bh, anim){ var vw = innerWidth, vh = innerHeight - topH(), m = 30; S.k = Math.min((vw - 2*m) / bw, (vh - 2*m) / bh); S.x = (vw - bw * S.k) / 2 - bx * S.k; S.y = topH() + (vh - bh * S.k) / 2 - by * S.k; apply(anim); }
function fitAll(anim){ fitTo(0, 0, WORLDW, WORLDH, anim); }
function zoomAt(f, cx, cy, anim){ var k = Math.max(.01, Math.min(4, S.k * f)); f = k / S.k; S.x = cx - (cx - S.x) * f; S.y = cy - (cy - S.y) * f; S.k = k; apply(anim); }
stage.addEventListener("wheel", function(e){ e.preventDefault(); if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)), e.clientX, e.clientY); else { S.x -= e.deltaX; S.y -= e.deltaY; apply(); } }, {passive: false});
var P = new Map(), last = null, moved = 0, pinch = null;
stage.addEventListener("pointerdown", function(e){ stage.setPointerCapture(e.pointerId); P.set(e.pointerId, {x: e.clientX, y: e.clientY}); moved = 0; stage.classList.add("drag"); if (P.size === 2){ var a = [...P.values()]; pinch = {d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y)}; } });
stage.addEventListener("pointermove", function(e){ if (!P.has(e.pointerId)) return; var p = P.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y; P.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (P.size === 2 && pinch){ var a = [...P.values()], d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); zoomAt(d / pinch.d, (a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2); pinch.d = d; moved += 10; return; }
  S.x += dx; S.y += dy; moved += Math.abs(dx) + Math.abs(dy); apply(); });
function up(e){ P.delete(e.pointerId); if (P.size < 2) pinch = null; if (!P.size) stage.classList.remove("drag"); }
stage.addEventListener("pointerup", function(e){ var was = moved; up(e); if (was < 6){ var t = document.elementFromPoint(e.clientX, e.clientY), it = t && t.closest(".it"); if (it && it.dataset.i) openLB(+it.dataset.i); } });
stage.addEventListener("pointercancel", up);
document.getElementById("zi").onclick = function(){ zoomAt(1.6, innerWidth / 2, innerHeight / 2, true); };
document.getElementById("zo").onclick = function(){ zoomAt(1 / 1.6, innerWidth / 2, innerHeight / 2, true); };
document.getElementById("fit").onclick = function(){ fitAll(true); };
var chips = document.getElementById("chips");
secs.forEach(function(s){ var b = document.createElement("button"); b.className = "chip"; b.textContent = s.title; b.onclick = function(){ fitTo(s.x, s.y, s.w, s.h, true); }; chips.appendChild(b); });
addEventListener("resize", function(){ fitAll(false); });

/* Videos laufen nur, wenn sie sichtbar und groß genug sind */
function videos(){ vids.forEach(function(v){ var r = v.getBoundingClientRect(), vis = r.right > 0 && r.left < innerWidth && r.bottom > 0 && r.top < innerHeight && r.width > 160; if (vis && v.paused) v.play().catch(function(){}); if (!vis && !v.paused) v.pause(); }); }

/* Scharfe Originale: sobald ein Bild groß genug auf dem Bildschirm steht, wird die Vorschau gegen das Original getauscht */
var hiBusy = 0;
function sharpen(){
  var vh = innerHeight, vw = innerWidth, dpr = window.devicePixelRatio || 1;
  document.querySelectorAll(".it img[data-hi]").forEach(function(im){
    if (im.dataset.done || hiBusy > 6) return;
    var r = im.getBoundingClientRect();
    if (r.right < -200 || r.left > vw + 200 || r.bottom < -200 || r.top > vh + 200) return;
    if (r.width * dpr < (im.naturalWidth || 1) * 0.85) return;
    im.dataset.done = "1"; hiBusy++;
    var pre = new Image(); pre.onload = pre.onerror = function(){ if (pre.naturalWidth) im.src = pre.src; hiBusy--; }; E(im.dataset.hi).then(function(u){ pre.src = u; }, function(){ hiBusy--; });
  });
}

/* ---------- Großansicht ---------- */
var lb = document.getElementById("lb"), lbin = document.getElementById("lbin");
var cur = -1;
function openLB(i){ cur = i; var o = items[i]; lbin.innerHTML = o.it.t === "vid" ? '<video controls autoplay muted loop playsinline></video>' : '<img alt=""' + (o.it.bg ? ' style="background:' + o.it.bg + ';padding:40px"' : '') + '>'; var lm = lbin.firstChild; E(o.it.t === "vid" ? o.it.src : (o.it.hi || o.it.src)).then(function(u){ if (cur === i) lm.src = u; }); document.getElementById("lbc").textContent = o.title + " · " + o.n + " von " + o.of; lb.hidden = false; }
function closeLB(){ lb.hidden = true; lbin.innerHTML = ""; cur = -1; }
function stepLB(d){ var n = cur + d; if (cur < 0 || n < 0 || n >= items.length) return; openLB(n); var nx = items[n + d]; if (nx && nx.it.t !== "vid") E(nx.it.hi || nx.it.src); }
document.getElementById("lbp").onclick = function(e){ e.stopPropagation(); stepLB(-1); };
document.getElementById("lbn").onclick = function(e){ e.stopPropagation(); stepLB(1); };
document.getElementById("lbx").onclick = closeLB; lb.addEventListener("click", function(e){ if (e.target === lb) closeLB(); });
addEventListener("keydown", function(e){ if (e.key === "Escape") closeLB(); if (!lb.hidden && !e.altKey && !e.ctrlKey && !e.metaKey && document.activeElement && document.activeElement.tagName !== "VIDEO") { if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); stepLB(1); } else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); stepLB(-1); } } if (e.key === "Enter" && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.i) openLB(+document.activeElement.dataset.i); });

fitAll(false); loadAll();
/* Sprungmarken: board/#video springt zum Erklärvideo, board/#Name zu einem Bereich */
function goHash(){ var h = decodeURIComponent((location.hash || "").slice(1)).toLowerCase(); if (!h) return; var alias = {video: "erklärvideo", logo: "logo kit", marke: "marke"}; h = alias[h] || h;
  var s = secs.filter(function(q){ return q.title.toLowerCase().indexOf(h) === 0; })[0] || secs.filter(function(q){ return q.title.toLowerCase().indexOf(h) > -1; })[0]; if (s) setTimeout(function(){ fitTo(s.x, s.y, s.w, s.h, true); }, 60); }
goHash(); addEventListener("hashchange", goHash);

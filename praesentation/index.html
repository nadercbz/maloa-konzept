</style>
<script>
window.SBP=(function(){
  var SALT="SocialBites-Pitch-v1",R=600000,key=null;
  function getPw(){try{return sessionStorage.getItem("akq-pw")||localStorage.getItem("akq-pw")||"";}catch(e){return "";}}
  function derive(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(km){return crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode(SALT),iterations:R,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);});}
  function dec(buf){var b=new Uint8Array(buf);if(String.fromCharCode(b[0],b[1],b[2],b[3])!=="SBP1")return Promise.reject(new Error("Format"));return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(4,16)},key,b.slice(16)).then(function(x){return new Uint8Array(x);});}
  function get(url){return fetch(url).then(function(r){if(!r.ok)throw new Error("Datei fehlt");return r.arrayBuffer();}).then(dec);}
  function unlock(test){
    var lock=document.getElementById("sbp-lock"),wait=document.getElementById("sbp-wait"),f=lock.querySelector("form"),err=lock.querySelector(".err");
    return new Promise(function(res){
      function versuch(pw,merk){wait.hidden=false;return derive(pw).then(function(k){key=k;return get(test);}).then(function(b){
        try{sessionStorage.setItem("akq-pw",pw);if(merk)localStorage.setItem("akq-pw",pw);}catch(e){}
        lock.hidden=true;wait.hidden=true;res(b);});}
      function zeigen(m){wait.hidden=true;lock.hidden=false;err.textContent=m||"";f.pw.focus();}
      f.addEventListener("submit",function(e){e.preventDefault();err.textContent="Prüfe …";versuch(f.pw.value,f.merk.checked).catch(function(){zeigen("Passphrase stimmt nicht.");});});
      var pw=getPw();if(pw)versuch(pw,false).catch(function(){zeigen("");});else zeigen("");
    });
  }
  return {unlock:unlock,get:get};
})();
</script>
<script>
SBP.unlock("p.enc").then(function(b){
  var u=URL.createObjectURL(new Blob([b],{type:"text/html"})), f=document.createElement("iframe");
  f.src=u; f.title="Ma'Loa Kampagne Berlin"; f.allow="fullscreen"; f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0";
  f.onload=function(){ try{ f.contentWindow.focus(); }catch(e){} }; document.body.appendChild(f);
});
</script></body></html>
